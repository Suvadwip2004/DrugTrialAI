[project]
name = "drugtrialai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "ollama>=0.6.3",
    "qdrant-client>=1.19.1",
    "spacy>=3.8.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
